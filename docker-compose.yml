# =============================================================================
#  Revel — self-contained demo stack for recording product videos
# =============================================================================
#
#   docker compose up -d          bring everything up (first run pulls ~1.5 GB)
#   docker compose ps             watch until every service says "healthy"
#   docker compose logs -f        follow logs
#   docker compose down           stop (keeps the database)
#   docker compose down -v        stop AND wipe the database (full reset)
#
#  Once healthy:
#     frontend   http://localhost:5173
#     API        http://localhost:8000/api/version
#     Mailpit    http://localhost:8025      (every email the app sends)
#
#  Everything here runs from PUBLISHED images — nothing is built locally, so
#  you never need the Revel source code to record a video.
#
#  ---------------------------------------------------------------------------
#  IMAGE TAGS
#  ---------------------------------------------------------------------------
#  The tags below are the latest releases as of 2026-09-06. Backend 2.8.0 is the
#  first release that carries the `bootstrap_demo_video` seeding command, so the
#  demo-video scenarios seed out of the box — do not go below it.
#
#  To move to a newer release: edit .env (copy it from .env.example first), set
#      REVEL_BACKEND_TAG=…
#      REVEL_FRONTEND_TAG=…
#  then `docker compose pull && docker compose up -d`.
#
#  Mind the asymmetry, it is easy to get wrong:
#      backend  image tags have NO "v"   → 2.8.0
#      frontend image tags HAVE the "v"  → v2.8.0
#  Published tags: https://github.com/orgs/letsrevel/packages
#  ---------------------------------------------------------------------------

name: revel-demos

# --- shared backend environment ----------------------------------------------
# All three backend containers (api, worker, bootstrap) run the same image with
# the same settings. Values live here rather than in .env on purpose: none of
# them are secret, and a missing .env must not silently change behaviour.
x-backend-env: &backend-env
  # -- core ---------------------------------------------------------------
  # Throwaway keys for a local demo box. Not secret, not reused anywhere.
  SECRET_KEY: demo-video-not-a-secret-key-do-not-reuse-anywhere
  SALT_KEY: 583l5Y4hl9WCwIu3qSpTctFZochMoegbghahnyUhUYE=
  DEBUG: "False"
  # The single switch that puts the app in demo mode. It makes /api/version
  # report demo:true, which is what makes the login page show the one-click
  # demo-account picker (very handy on camera) and forces questionnaire
  # scoring onto its mock backend so no LLM is needed.
  DEMO_MODE: "True"
  # Without this the backend calls itself a production deployment (that is the
  # default whenever DEBUG is False) and switches on the full HTTPS hardening
  # block: every http:// request is 301'd to https://, and a one-year HSTS
  # header is sent. On localhost both are actively harmful — the API becomes
  # unreachable over http (so `npm run doctor`, the arrange scripts and the
  # frontend's server-side rendering all fail), and the HSTS header pins
  # *localhost itself* to https in the browser for a year, breaking every other
  # local project on the machine. Any value other than "production" is fine.
  DEPLOYMENT_ENVIRONMENT: demo
  ALLOWED_HOSTS: web,localhost,127.0.0.1
  # DEBUG=False closes CORS completely unless this is set explicitly.
  CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  SITE_DOMAIN: localhost:8000
  SITE_NAME: Revel
  BASE_URL: http://localhost:8000
  # NOTE: this only seeds a DB row on first boot. Changing it later has no
  # effect — the app reads the stored value. `down -v` to really change it.
  FRONTEND_BASE_URL: http://localhost:5173
  SERVICE_DESCRIPTION: The Revel API
  ADMIN_URL: admin/

  # -- database / cache ---------------------------------------------------
  DB_NAME: revel
  DB_USER: revel
  DB_PASSWORD: revel
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USE_PGBOUNCER: "False"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CELERY_REDIS_DB: "0"
  CELERY_TASK_ALWAYS_EAGER: "False"

  # -- email → Mailpit ----------------------------------------------------
  # EMAIL_DRY_RUN=False is load-bearing: when true the app writes mail to its
  # own console instead of sending it, and Mailpit stays empty — which breaks
  # the demo scripts, since they read verification links out of Mailpit.
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  EMAIL_USE_TLS: "False"
  EMAIL_USE_SSL: "False"
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  EMAIL_DRY_RUN: "False"
  DEFAULT_FROM_EMAIL: Revel Demo <noreply@localhost>
  DEFAULT_REPLY_TO_EMAIL: Revel Demo <noreply@localhost>
  DEFAULT_BILLING_EMAIL: Revel Demo <billing@localhost>
  INTERNAL_CATCHALL_EMAIL: internal@localhost

  # -- seeded superuser (Django admin at /admin/) -------------------------
  DEFAULT_SUPERUSER_USERNAME: admin@example.com
  DEFAULT_SUPERUSER_EMAIL: admin@example.com
  DEFAULT_SUPERUSER_PASSWORD: password123

  # -- features -----------------------------------------------------------
  FEATURE_ORGANIZATION_CREATION: "True"
  FEATURE_LLM_EVALUATION: "False"
  FEATURE_TELEGRAM: "False"
  FEATURE_MALWARE_SCAN: "False"
  FEATURE_OBSERVABILITY: "False"

  # =======================================================================
  #  FAKE single-sign-on — makes the login/register page render a real
  #  "Continue with Google" button.
  # =======================================================================
  # The provider list is a CSV of keys; each key reads its own OIDC_<KEY>_*
  # vars. The key must be exactly `google` for the Google-branded button —
  # any other key renders a plain generic button. OIDC_GOOGLE_NAME is the
  # word after "Continue with".
  #
  # These values are FAKE and grant access to nothing. They are enough
  # because the credentials are never checked at startup — the app only
  # contacts the issuer when somebody actually clicks the button. So the
  # button RENDERS and photographs correctly; clicking it will fail. Do not
  # film the click.
  #
  # The issuer must be https:// (a plain-http issuer is rejected unless
  # DEBUG=True), which is why it points at the real Google endpoint.
  OIDC_PROVIDERS: google
  OIDC_GOOGLE_NAME: Google
  OIDC_GOOGLE_ISSUER: https://accounts.google.com
  OIDC_GOOGLE_CLIENT_ID: 473859204837-demovideo7q2klm3n4p5r6s8t9u0vwxyz.apps.googleusercontent.com
  OIDC_GOOGLE_CLIENT_SECRET: GOCSPX-DemoVideo-Fake-Secret-000000000
  OIDC_GOOGLE_SCOPES: openid email profile

  # =======================================================================
  #  FAKE wallet passes — makes tickets and membership cards render the
  #  "Add to Apple Wallet" and "Add to Google Wallet" buttons.
  # =======================================================================
  # This is GLOBAL configuration, not per-organization: the app advertises
  # a wallet pass on a ticket when these settings are non-empty strings. It
  # never checks that the files exist, so the buttons appear either way.
  #
  # The files in fake-secrets/ (self-signed, committed, worthless) exist so
  # that *clicking* a button produces an actual — invalid — pass instead of
  # a 500 error page on camera. Regenerate with scripts/make-fake-secrets.sh.
  APPLE_WALLET_PASS_TYPE_ID: pass.io.letsrevel.demo
  APPLE_WALLET_TEAM_ID: DEMOTEAM01
  APPLE_WALLET_CERT_PATH: /fake-secrets/pass.pem
  APPLE_WALLET_KEY_PATH: /fake-secrets/pass-key.pem
  APPLE_WALLET_WWDR_CERT_PATH: /fake-secrets/wwdr.pem
  APPLE_WALLET_KEY_PASSWORD: ""
  GOOGLE_WALLET_ISSUER_ID: "3388000000022473859"
  GOOGLE_WALLET_SERVICE_ACCOUNT_KEY_PATH: /fake-secrets/google-wallet-sa.json
  GOOGLE_WALLET_CLASS_PREFIX: revel-demo

x-backend-image: &backend-image ghcr.io/letsrevel/revel:${REVEL_BACKEND_TAG:-2.8.0}

# --- image architecture ------------------------------------------------------
# The Revel images and the PostGIS image are published for linux/amd64 only. On
# an Intel/AMD machine (any normal Linux server, and Intel Macs) this changes
# nothing.
#
# On an Apple-Silicon Mac it is what makes the stack run at all: without it the
# pull fails outright with
#     no matching manifest for linux/arm64/v8 in the manifest list entries
# and nothing starts. With it, Docker Desktop runs the images emulated — slower
# to boot, but correct. Leave it alone unless arm64 images start being
# published, in which case set REVEL_PLATFORM=linux/arm64 in .env.
x-platform: &platform ${REVEL_PLATFORM:-linux/amd64}

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL + PostGIS. PostGIS is not optional — the app stores event
  # locations as geographic points and will not migrate on plain postgres.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:17-3.5
    platform: *platform
    environment:
      POSTGRES_DB: revel
      POSTGRES_USER: revel
      POSTGRES_PASSWORD: revel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U revel']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis — Celery broker and cache.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Mailpit — catches every email the app sends. Nothing leaves your machine.
  # The demo scripts read verification links out of its API, so this is a hard
  # dependency, not a convenience.  UI: http://localhost:8025
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025' # web UI + API
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      MP_MAX_MESSAGES: '5000'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8025/api/v1/info']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-shot volume preparation. The `media` volume is shared by web, worker
  # and bootstrap so that cover art seeded by one is served by the others.
  #
  # Docker creates a named volume owned by root:root, but the Revel image runs
  # as the unprivileged `appuser`. Without this step the very first thing
  # seeding does — writing cover art into media/ — dies with
  #     PermissionError: [Errno 13] Permission denied: '/app/src/media/cover-art'
  # and takes the whole stack down with it, because `frontend` waits for
  # `bootstrap` to succeed. So: chown the volume once, as root, before anything
  # else opens it. Cheap, idempotent, and a no-op on later boots.
  # ---------------------------------------------------------------------------
  media-init:
    image: *backend-image
    platform: *platform
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - 'mkdir -p /app/src/media && chown -R appuser:appuser /app/src/media'
    volumes:
      - media:/app/src/media
    restart: 'no'

  # ---------------------------------------------------------------------------
  # The API. Must be called `web` — the frontend's server-side rendering calls
  # it by that hostname, and that name is in ALLOWED_HOSTS.
  # Database migrations run automatically here, because the image's entrypoint
  # migrates whenever the command starts with the word `gunicorn`.
  # ---------------------------------------------------------------------------
  web:
    image: *backend-image
    platform: *platform
    environment: *backend-env
    command:
      - gunicorn
      - revel.wsgi:application
      - --worker-class=gthread
      - --workers=2
      - --threads=4
      - --bind=0.0.0.0:8000
      - --timeout=120
    ports:
      - '8000:8000'
      # Published here on purpose, not on `frontend`: that service shares this
      # container's network namespace (see its network_mode), so its port has
      # to be declared on the namespace's owner.
      - '5173:3000'
    volumes:
      - ./fake-secrets:/fake-secrets:ro
      - media:/app/src/media
      # The image ships without the IP2Location database (it is a ~168 MB
      # licensed download). The backend geolocates the caller's IP to sort
      # events nearest-first, and its lookup helper stat()s that file OUTSIDE
      # its own try/except — so when the file is missing, the whole public
      # events listing 500s and the app's /events discovery page renders
      # "try again later" with no events on it.
      #
      # This zero-filled stand-in is enough: the loader opens it, the lookup
      # inside it fails, and that failure IS caught — the request falls back to
      # "no location known" and returns the events unsorted, which is exactly
      # what a demo box wants. Never ship this to a real deployment.
      - ./fake-secrets/ip2location-stub.BIN:/app/src/geo/data/IP2LOCATION-LITE-DB5.BIN:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      media-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthcheck', timeout=5)"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Background worker. NOT optional: account-verification emails, notifications
  # and image thumbnails are all dispatched as background jobs. Without it the
  # demo scripts hang waiting for a verification email that never arrives.
  #
  # (There is deliberately no `beat` scheduler here. In demo mode the schedule
  # can include a task that wipes and re-seeds all demo data — which would be a
  # catastrophe halfway through a recording.)
  # ---------------------------------------------------------------------------
  worker:
    image: *backend-image
    platform: *platform
    environment: *backend-env
    command:
      - celery
      - -A
      - revel
      - worker
      - --loglevel=INFO
      - --concurrency=2
      - --hostname=worker-default@%h
    volumes:
      - ./fake-secrets:/fake-secrets:ro
      - media:/app/src/media
      - ./fake-secrets/ip2location-stub.BIN:/app/src/geo/data/IP2LOCATION-LITE-DB5.BIN:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      media-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-shot seeding. Runs once when the database is empty, then exits.
  # See scripts/bootstrap-demo.sh — it migrates, seeds the standard demo world
  # (organizations, events, the @example.com accounts), and then runs the
  # demo-video scenario seeding.
  #
  # Re-run it by hand at any time:   npm run reseed
  # Wipe and start over completely:  docker compose down -v && docker compose up -d
  # ---------------------------------------------------------------------------
  bootstrap:
    image: *backend-image
    platform: *platform
    environment:
      <<: *backend-env
      # set to 1 to force a re-seed of an already-populated database
      FORCE_RESEED: '${FORCE_RESEED:-0}'
    entrypoint: ['/bin/sh', '/bootstrap-demo.sh']
    volumes:
      - ./scripts/bootstrap-demo.sh:/bootstrap-demo.sh:ro
      - ./fake-secrets:/fake-secrets:ro
      - media:/app/src/media
      - ./fake-secrets/ip2location-stub.BIN:/app/src/geo/data/IP2LOCATION-LITE-DB5.BIN:ro
    depends_on:
      web: { condition: service_healthy }
    restart: 'no'

  # ---------------------------------------------------------------------------
  # The web app itself → http://localhost:5173
  #
  # PUBLIC_API_URL is the address the BROWSER uses to reach the API, so it must
  # be a localhost URL, not the internal container name. INTERNAL_API_URL is
  # the one used for server-side rendering, inside the Docker network.
  #
  # It waits for seeding to finish, so when this reports healthy the demo data
  # is really there.
  # ---------------------------------------------------------------------------
  frontend:
    image: ghcr.io/letsrevel/revel-frontend:${REVEL_FRONTEND_TAG:-v2.8.0}
    platform: *platform
    # Share the API container's network namespace, so that inside this
    # container `localhost:8000` IS the API.
    #
    # Why that is necessary: PUBLIC_API_URL is the address the BROWSER uses, so
    # it has to be http://localhost:8000. Server-side rendering normally
    # rewrites API calls to INTERNAL_API_URL — but the app's token-refresh
    # endpoint calls the API through the generated client rather than
    # SvelteKit's request-scoped fetch, so it is never rewritten and asks for
    # http://localhost:8000 from inside this container. With its own network
    # namespace that is the frontend itself, nothing listens on 8000, and every
    # refresh fails: sign-in appears to work, then the browser silently drops
    # back to logged-out (no notification bell, "Login"/"Sign Up" still in the
    # navbar) — which strands every recording that films a signed-in view.
    #
    # Sharing the namespace makes one address correct for both sides. Note the
    # consequences: this service publishes no ports of its own (5173 is
    # declared on `web` above) and is no longer reachable as `frontend` by
    # name — nothing here needs either.
    network_mode: 'service:web'
    environment:
      PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://web:8000
      ORIGIN: http://localhost:5173
      NODE_ENV: production
      PORT: '3000'
      HOST: 0.0.0.0
      ENABLE_METRICS: 'false'
      LOG_LEVEL: info
    depends_on:
      web: { condition: service_healthy }
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://localhost:3000', r => { if (r.statusCode !== 200) process.exit(1) }).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  media:
