      <script>

          // ------------------------------------------------ seam in: whip streaks

          // ------------------------------------------------ frame 10: serif lines

          tl.to('#s4-in-t1, #s4-in-t2', { opacity: 0, filter: 'blur(8px)', y: -10, duration: 0.4, ease: 'power2.in' }, L(62.35));

          tl.to('#s4-in-chip-p', { opacity: 0, y: -8, duration: 0.25, ease: 'power2.in' }, callT + 0.06);

          tl.fromTo('#s4-in-ren2', { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, callT + 0.25);

          tl.fromTo('#s4-in-ticket', { opacity: 0, scale: 0.55, rotation: -9, y: 40 }, { opacity: 1, scale: 1, rotation: 0, y: 0, duration: 0.85, ease: 'back.out(1.9)' }, L(63.12));

          // everything yields to the flood

          tl.fromTo('#s4-in-flash', { opacity: 0 }, { opacity: 1, duration: 0.42, ease: 'power3.in' }, L(65.03));
