      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const L = 71.4, M = FILM.T.montage, END = FILM.T.montageEnd;
          const A = t => t - L;
          const $ = s => document.querySelector(s);

          // ---- QR (seeded, deterministic)
          (function () {
            const r = FILM.rng(4242), n = 21; let s = '<svg viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges"><g fill="#0D1E1C">';
            const fin = (a, b) => [[0, 0], [0, 14], [14, 0]].some(([i, j]) => a >= i && a < i + 7 && b >= j && b < j + 7);
            for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
              let on;
              if (fin(i, j)) { const [a, b] = [[0, 0], [0, 14], [14, 0]].find(([p, q]) => i >= p && i < p + 7 && j >= q && j < q + 7); const di = i - a, dj = j - b; on = di === 0 || di === 6 || dj === 0 || dj === 6 || (di >= 2 && di <= 4 && dj >= 2 && dj <= 4); }
              else on = r() > 0.52;
              if (on) s += '<rect x="' + j + '" y="' + i + '" width="1.02" height="1.02"/>';
            }
            $('#s5-qr-svg').innerHTML = s + '</g></svg>';
            $('#s5-qr-svg').style.cssText = 'width:100%;height:100%';
          })();

          // ---- helpers
          function words(el, times, o = {}) {
            const toks = el.textContent.trim().split(/\s+/); el.textContent = '';
            toks.forEach((tk, i) => {
              const s = document.createElement('span'); s.textContent = tk; s.style.display = 'inline-block';
              el.appendChild(s); if (i < toks.length - 1) el.appendChild(document.createTextNode(' '));
              tl.fromTo(s, { opacity: 0, y: o.y ?? 34, scale: o.scale ?? 0.94, filter: 'blur(' + (o.blur ?? 8) + 'px)' },
                { opacity: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: o.dur ?? 0.38, ease: o.ease || 'back.out(1.5)' }, A(times[i]) - 0.02);
            });
          }
          const W = (id, w) => FILM.wordAt(id, w);
          const show = (sel, t, v = 1) => tl.set(sel, { opacity: v }, A(t));
          const pop = (sel, t, from = 0.6, dur = 0.5) => tl.fromTo(sel, { scale: from, opacity: 0 }, { scale: 1, opacity: 1, duration: dur, ease: 'back.out(1.8)' }, A(t));
          function press(sel, t) { tl.to(sel, { scale: 0.92, duration: 0.07, ease: 'power2.in' }, A(t)); tl.to(sel, { scale: 1, duration: 0.18, ease: 'back.out(3)' }, A(t) + 0.07); }
          function cursor(sel, t0, t1, dx, dy) {
            tl.fromTo(sel, { x: dx, y: dy, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: t1 - t0, ease: 'power2.out' }, A(t0));
          }

          // ---- panel visibility: hard cuts on the montage beats
          const ids = ['#s5-p1', '#s5-p2', '#s5-p3', '#s5-p4', '#s5-p5', '#s5-p6'];
          const ends = [M[1], M[2], M[3], M[4], M[5], END];
          ids.forEach((id, i) => {
            tl.set(id, { opacity: 1 }, A(M[i]));
            if (i < 5) tl.set(id, { opacity: 0 }, A(ends[i]));
            // entrance on the beat: card springs, blob swells, bar draws
            tl.fromTo(id + ' .s5-cw', { y: 70, scale: 0.9, rotation: -1.6, opacity: 0, transformOrigin: '0% 50%' },
              { y: 0, scale: 1, rotation: 0, opacity: 1, duration: 0.55, ease: 'back.out(1.5)' }, A(M[i]));
            tl.fromTo(id + ' .s5-blob', { scale: 0.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: 'expo.out' }, A(M[i]));
            tl.fromTo(id + ' .s5-bar', { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: 'expo.out' }, A(M[i]) + 0.06);
            // slow drift so nothing is dead still
            tl.fromTo(id + ' .s5-blob', { x: 0, y: 0 }, { x: 24, y: -14, duration: ends[i] - M[i], ease: 'none' }, A(M[i]));
          });

          // ---- labels, on his words
          words($('#s5-p1 .s5-lbl'), [W('v17a', 0)]);
          words($('#s5-p2 .s5-lbl'), [W('v17b', 0), W('v17b', 1)]);
          words($('#s5-p3 .s5-lbl'), [W('v17c', 0), W('v17c', 1), W('v17c', 2), W('v17c', 3)]);
          words($('#s5-p4 .s5-lbl'), [W('v17d', 0)]);
          words($('#s5-p5 .s5-lbl'), [W('v17e', 0), W('v17e', 2), W('v17e', 3), W('v17e', 4)]);
          words($('#s5-p6 .s5-lbl'), [W('v17f', 0), W('v17f', 1), W('v17f', 2)]);

          // ---- 1 potluck: a dish gets claimed
          (function () {
            const s = M[0];
            ['#s5-p1-r1', '#s5-p1-r2', '#s5-p1-r3'].forEach((r, i) => tl.fromTo(r, { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, A(s) + 0.1 + i * 0.07));
            cursor('#s5-p1-cur', s + 0.35, s + 0.85, 150, 90);
            press('#s5-p1-btn', s + 0.88);
            tl.set('#s5-p1-btn', { opacity: 0 }, A(s + 0.97));
            tl.fromTo('#s5-p1-you', { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: 'back.out(2.2)' }, A(s + 0.97));
            tl.fromTo('#s5-p1-r3', { backgroundColor: '#F6F2FC' }, { backgroundColor: '#E9DBF9', duration: 0.12, yoyo: true, repeat: 1, ease: 'power1.inOut' }, A(s + 0.97));
            tl.to('#s5-p1-cur', { opacity: 0, x: 40, y: 30, duration: 0.3, ease: 'power2.in' }, A(s + 1.15));
            tl.to('#s5-p1-fill', { scaleX: 1, duration: 0.5, ease: 'power3.out' }, A(s + 1.0));
            tl.set('#s5-p1-cnt', { textContent: '3 of 3 dishes claimed' }, A(s + 1.0));
          })();

          // ---- 2 member pricing: the members price lands
          (function () {
            const s = M[1];
            tl.fromTo('#s5-t-gen', { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: 'back.out(1.4)' }, A(s) + 0.05);
            tl.fromTo('#s5-t-mem', { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: 'back.out(1.4)' }, A(s) + 0.15);
            const p = { v: 18 };
            tl.fromTo(p, { v: 18 }, { v: 12, duration: 0.5, ease: 'power3.inOut', onUpdate: () => { $('#s5-mem-pr').textContent = '€' + Math.round(p.v); } }, A(s) + 0.6);
            tl.fromTo('#s5-mem-pr', { scale: 1 }, { scale: 1.1, duration: 0.14, yoyo: true, repeat: 1, ease: 'power2.out', transformOrigin: '0% 50%' }, A(s) + 1.08);
            pop('#s5-mem-save', s + 1.12, 0.4, 0.45);
            tl.to('#s5-t-mem', { y: -14, scale: 1.05, duration: 0.4, ease: 'back.out(2)' }, A(s) + 1.1);
            tl.to('#s5-t-gen', { opacity: 0.62, duration: 0.4 }, A(s) + 1.1);
          })();

          (function () {
            const s = M[2], p = { v: 5 }; // slider track is 100% of #s5-sl inner width
            const apply = () => {

            tl.to('#s5-p3-cur', { x: 250, duration: 0.9, ease: 'power3.inOut' }, A(s) + 0.45);

            tl.set('#s5-p3-c5', { backgroundColor: '#F6F2FC' }, A(s + 0.5));
            tl.set('#s5-p3-c15', { backgroundColor: '#8C3CDD', color: '#fff' }, A(s + 1.35));
            tl.fromTo('#s5-p3-c15', { scale: 1 }, { scale: 1.12, duration: 0.14, yoyo: true, repeat: 1, ease: 'power2.out' }, A(s + 1.35));
            tl.fromTo('#s5-p3-amt', { scale: 1 }, { scale: 1.1, duration: 0.14, yoyo: true, repeat: 1, ease: 'power2.out', transformOrigin: '0% 80%' }, A(s + 1.35));
          })();

          // ---- 4 waitlist: #3 → #2 → #1 → a spot opens
          (function () {
            const s = M[3];
            tl.fromTo('#s5-n3', { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, A(s) + 0.05);
            const swap = (from, to, t, gone) => {
              tl.to(gone, { x: -40, scale: 0.5, opacity: 0, duration: 0.25, ease: 'power2.in' }, A(t) - 0.05);
              tl.to(from, { y: -26, opacity: 0, duration: 0.18, ease: 'power2.in' }, A(t));
              tl.fromTo(to, { y: 28, opacity: 0, scale: 1 }, { y: 0, opacity: 1, duration: 0.4, ease: 'back.out(1.9)' }, A(t) + 0.06);
            };
            swap('#s5-n3', '#s5-n2', s + 0.5, '#s5-qa');
            swap('#s5-n2', '#s5-n1', s + 0.9, '#s5-qb');
            // the spot opens
            tl.to('#s5-p4-queue', { opacity: 0, y: -20, duration: 0.22, ease: 'power2.in' }, A(s + 1.3));
            tl.fromTo('#s5-p4-open', { opacity: 0, y: 24, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'back.out(1.6)' }, A(s + 1.5));
            cursor('#s5-p4-cur', s + 1.6, s + 1.85, 100, 60);
            press('#s5-p4-claim', s + 1.88);
          })();

          // ---- 5 check-in: scan → checked in
          (function () {
            const s = M[4];
            tl.fromTo('#s5-scan', { y: -36 }, { y: 150, duration: 0.55, ease: 'power1.inOut' }, A(s) + 0.2);
            tl.to('#s5-scan', { opacity: 0, duration: 0.1 }, A(s) + 0.75);
            tl.to('#s5-qr-svg', { opacity: 0.16, duration: 0.25 }, A(s) + 0.78);
            tl.fromTo('#s5-ok', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(2.2)' }, A(s) + 0.78);
            tl.to('#s5-ok-p', { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out' }, A(s) + 0.95);
            tl.set('#s5-p5-chip', { backgroundColor: '#8C3CDD', color: '#fff', textContent: 'Checked in' }, A(s + 0.8));
            tl.fromTo('#s5-p5-chip', { scale: 0.7 }, { scale: 1, duration: 0.4, ease: 'back.out(2.4)' }, A(s + 0.8));
            tl.set('#s5-p5-n', { textContent: '37' }, A(s + 0.85));
            tl.fromTo('#s5-p5-n', { scale: 1.5 }, { scale: 1, duration: 0.35, ease: 'power3.out' }, A(s + 0.85));
          })();

          // ---- 6 languages: the same label, six ways
          (function () {
            const s = M[5] + 0.03, step = 0.26;
            const lg = document.querySelectorAll('#s5-p6 .s5-lg'), ch = document.querySelectorAll('#s5-sw .c');
            lg.forEach((g, i) => {
              const t0 = s + i * step, last = i === lg.length - 1;
              tl.set(g, { opacity: 1 }, A(t0));
              if (!last) tl.set(g, { opacity: 0 }, A(t0 + step));
              tl.fromTo(g, { y: 18, scale: 0.97 }, { y: 0, scale: 1, duration: 0.28, ease: 'back.out(2)' }, A(t0));
              tl.set(ch[i], { backgroundColor: '#8C3CDD', color: '#fff' }, A(t0));
              if (i > 0) tl.set(ch[i - 1], { backgroundColor: '#F6F2FC', color: '#6B5F7E' }, A(t0));
              tl.fromTo(ch[i], { scale: 1.18 }, { scale: 1, duration: 0.3, ease: 'back.out(2)' }, A(t0));
            });
          })();

          // ---- the breath: the montage clears in one slow exhale at the drop
          tl.to('#s5-mont', { opacity: 0, y: 10, scale: 0.985, duration: 0.7, ease: 'power2.inOut', transformOrigin: '50% 50%' }, A(END) + 0.04);

          // ---- the mark
          tl.fromTo('#s5-glow', { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 2.2, ease: 'power2.out' }, A(84.4));
          tl.fromTo('#s5-lock-r', { opacity: 0, scale: 0.985, filter: 'blur(5px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.85, ease: 'power2.out', transformOrigin: '960px 330px' }, A(84.2));
          tl.fromTo('#s5-lock', { scale: 1 }, { scale: 1.035, duration: 95 - 84.2, ease: 'none' }, A(84.2));

          // tagline, verbatim, on his words (two lines)
          (function () {
            const t1 = ['The', 'free,', 'open-source', 'event', 'platform'], k1 = ['the', 'free', 'open', 'event', 'platform'];
            const t2 = ['for', 'communities,', 'clubs', 'and', 'independent', 'venues.'], k2 = ['for', 'communities', 'clubs', 'and', 'independent', 'venues'];
            const build = (el, toks, keys) => {
              el.textContent = '';
              toks.forEach((tk, i) => {
                const sp = document.createElement('span'); sp.textContent = tk; sp.style.display = 'inline-block';
                el.appendChild(sp); if (i < toks.length - 1) el.appendChild(document.createTextNode(' '));
                tl.fromTo(sp, { opacity: 0, y: 14, filter: 'blur(10px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.5, ease: 'power3.out' }, A(W('v18', keys[i])) - 0.04);
              });
            };
            build($('#s5-tag1'), t1, k1); build($('#s5-tag2'), t2, k2);
          })();
          tl.fromTo('#s5-url', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.9, ease: 'power2.out' }, A(90.6));
          // the tagline leaves, the wordmark answers him: "Let's revel."
          tl.to('#s5-tag', { opacity: 0, y: -10, filter: 'blur(6px)', duration: 0.5, ease: 'power2.in' }, A(91.25));
          tl.fromTo('#s5-lock-w', { opacity: 0, clipPath: 'inset(74% 100% 0 0)' }, { opacity: 1, clipPath: 'inset(74% 0% 0 0)', duration: 0.9, ease: 'power3.inOut' }, A(91.8));

          window.__timelines['s5-everything'] = tl;
        })();
      </script>
