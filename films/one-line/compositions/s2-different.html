          const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
          const KW = /\b(import|from|class|def|return|if|for|in|not|and|or|is|None|True|False|raise|self|with|as)\b/g;
          const colorize = line => {
            const ci = line.indexOf('#');
            let code = ci >= 0 ? line.slice(0, ci) : line, com = ci >= 0 ? line.slice(ci) : '';
            code = esc(code).replace(/("[^"]*"|'[^']*')/g, '\u0001$1\u0002').replace(KW, '<span class="k">$1</span>').replace(/\u0001/g, '<span class="s">').replace(/\u0002/g, '</span>');
            return code + (com ? '<span class="c">' + esc(com) + '</span>' : '');
          };
          const CODE = window.CODE;
          const layers = [
            { id: 's2-cl-far',  fs: 15, lh: 23, n: 58, trim: 70, cols: [40, 650, 1260], off: [0, 41, 83],  speed: 12, par: 0.10, step: 3 },
            { id: 's2-cl-mid',  fs: 21, lh: 31, n: 46, trim: 68, cols: [90, 1010],      off: [17, 66],     speed: 26, par: 0.30, step: 3 },
            { id: 's2-cl-near', fs: 34, lh: 52, n: 30, trim: 38, cols: [20, 960],       off: [29, 91],     speed: 58, par: 0.80, step: 2 },
          ];
          layers.forEach(Ly => {
            const el = $(Ly.id); Ly.el = el;
            Ly.cols.forEach((x, c) => {
              const pre = document.createElement('pre');
              const lines = [];
              for (let i = 0; i < Ly.n; i++) lines.push(colorize(CODE[(Ly.off[c] + i) % CODE.length].slice(0, Ly.trim)));
              pre.innerHTML = lines.join('\n');
              pre.style.cssText = `left:${x}px;top:${-Ly.lh * 4}px;font-size:${Ly.fs}px;line-height:${Ly.lh}px;`;
              el.appendChild(pre);
            });
          });
          F.revealWords(tl, $('s2-f5-h'), 'v06', S, { from: 0, to: 2, y: 22, blur: 14, dur: 0.5 }); gap($('s2-f5-h'));
          // verbs snap in on his words, each a hard punch
          [['s2-v1', 'read'], ['s2-v2', 'run'], ['s2-v3', 'make']].forEach(([id, w], i) => {
            const t0 = F.wordAt('v06', w);
            tl.fromTo('#' + id, { opacity: 0, scale: 1.28, y: 24, filter: 'blur(10px)' },
              { opacity: 1, scale: 1, y: 0, filter: 'blur(0px)', duration: 0.3, ease: 'power4.out' }, L(t0 - 0.03));
          });
          const msT = F.wordAt('v06', 'source') + 0.5;
          tl.fromTo('#s2-f5-pill', { opacity: 0, scale: 0.6, y: 18 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: 'back.out(1.8)' }, L(msT));

          // ------------------------------------------------ FRAME 6a  —  the price
          F.revealWords(tl, $('s2-f6a-a'), 'v07', S, { from: 0, to: 4 }); gap($('s2-f6a-a'));
          F.revealWords(tl, $('s2-f6a-b'), 'v07', S, { from: 5, to: 8, y: 22, blur: 12, dur: 0.5 }); gap($('s2-f6a-b'));
          tl.fromTo('#s2-card', { opacity: 0, x: 260, y: 40, rotationY: -26, rotationX: 6, scale: 0.92, transformPerspective: 1700 },
            { opacity: 1, x: 0, y: 0, rotationY: -6, rotationX: 2, scale: 1, duration: 0.95, ease: 'expo.out' }, L(T.c6 + 0.06));
          tl.to('#s2-card', { rotationY: -2, rotationX: 0, y: -8, duration: 3.1, ease: 'sine.inOut' }, L(T.c6 + 1.0));
          const wp = F.wordAt('v07', 'price'), wf = F.wordAt('v07', 'fee'), wt = F.wordAt('v07', 'top');
          tl.fromTo('#s2-row-ga .rowbg', { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power2.out' }, L(wp));
          tl.fromTo('#s2-ga-am', { scale: 1 }, { scale: 1.22, color: '#8C3CDD', duration: 0.18, yoyo: true, repeat: 1, ease: 'power2.out' }, L(wp));
          tl.fromTo('#s2-fee-am', { color: '#6B5F80' }, { color: '#8C3CDD', duration: 0.25 }, L(wf));
          tl.fromTo('#s2-tag', { opacity: 0, scale: 0.5, x: -8 }, { opacity: 1, scale: 1, x: 0, duration: 0.45, ease: 'back.out(2)' }, L(wf));
          tl.fromTo('#s2-chk', { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2.4)' }, L(wt));
          tl.fromTo('#s2-tot-am', { scale: 1 }, { scale: 1.14, duration: 0.16, yoyo: true, repeat: 1, ease: 'power2.out' }, L(wt));

          // ------------------------------------------------ FRAME 6b  —  the money goes straight to the organizer
          // Pace of the pickup line. When his take of v08 is in timing.json (7 words) its own times win.
          const own = (F.line('v08') || { words: [] }).words;
          if (own.length === 7) { F.revealWords(tl, $('s2-f6b-t'), 'v08', S, { from: 0, to: 6 }); gap($('s2-f6b-t'), 0.22); }
          else {
            const base = 30.52, offs = [0, 0.22, 0.62, 0.92, 1.36, 1.5, 1.66];   // The money goes straight to the organizer.
            const el = $('s2-f6b-t'), toks = el.textContent.trim().split(' ');
            el.textContent = '';
            toks.forEach((tok, i) => {
              const sp = document.createElement('span');
              sp.className = 'w'; sp.textContent = tok; sp.style.display = 'inline-block'; sp.style.willChange = 'transform, opacity, filter';
              if (i === 6) sp.style.color = '#8C3CDD';
              el.appendChild(sp); if (i < toks.length - 1) el.appendChild(document.createTextNode(' '));
              tl.fromTo(sp, { opacity: 0, y: 16, filter: 'blur(10px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.45, ease: 'power3.out' }, L(base + offs[i] - 0.04));
            });
            gap(el, 0.22);
          }
          tl.fromTo('#s2-buyer', { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.6, ease: 'back.out(1.7)' }, L(T.c6b + 0.05));
          tl.fromTo('#s2-buyer-l', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, L(T.c6b + 0.3));
          tl.fromTo('#s2-vc', { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.6, ease: 'back.out(1.6)' }, L(31.9));
          tl.fromTo('#s2-vc-l', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, L(32.1));
          tl.fromTo('#s2-coin-i', { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2.2)' }, L(31.1));
          tl.to('#s2-coin-i', { opacity: 0, scale: 0.4, duration: 0.2, ease: 'power2.in' }, L(SS.COIN.arrive));
          tl.set('#s2-coin', { display: 'block' }, L(31.0));
          tl.set('#s2-coin', { display: 'none' }, L(SS.COIN.arrive + 0.25));
          ['s2-p1', 's2-p2'].forEach((id, i) => tl.fromTo('#' + id, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.7, duration: 0.7, ease: 'power3.out', immediateRender: false }, L(SS.COIN.arrive + i * 0.16)));
          tl.fromTo('#s2-vc', { scale: 1 }, { scale: 1.1, duration: 0.14, yoyo: true, repeat: 1, ease: 'power2.out' }, L(SS.COIN.arrive));
          tl.fromTo('#s2-chip', { opacity: 0, y: 24, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: 'back.out(1.8)' }, L(SS.COIN.arrive + 0.05));

          // ------------------------------------------------ FRAME 7  —  private
          // tags clipped to the rope
          const PINS = [
            { k: 'ad', x: 400,  pop: 33.86, lab: 'AD', fx: -1 },
            { k: 'ad', x: 760,  pop: 34.01, lab: 'AD', fx: 1 },
            { k: 'pin', x: 1100, pop: 34.66, fx: -1 },
            { k: 'eye', x: 1420, pop: 34.81, fx: 1 },
            { k: 'xh',  x: 1740, pop: 34.96, fx: -1 },
          ];
          const g7 = $('s2-g7');
          const svgPin = '<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0113 0c0 5.4-6.5 11-6.5 11z" fill="#E6332A" stroke="#E6332A"/><circle cx="12" cy="10" r="2.6" stroke="#fff" fill="none"/></svg>';
          const svgEye = '<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3" fill="#fff"/></svg>';
          const svgXh = '<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#0D1E1C" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.4" fill="#0D1E1C"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/></svg>';
          PINS.forEach((p, i) => {
            const w = document.createElement('div'); w.className = 'pinw'; p.w = w;
            let body = '';
            if (p.k === 'ad') body = `<div class="body ad">${p.lab}<small>SPONSORED</small></div>`;
            else if (p.k === 'pin') body = `<div class="body rd" style="background:#fff;border:0;">${svgPin}</div>`;
            else if (p.k === 'eye') body = `<div class="body rd" style="background:#AB82DB;">${svgEye}</div>`;
            else body = `<div class="body rd" style="background:#9AB2FF;">${svgXh}</div>`;
            w.innerHTML = `<div class="pin"><div class="pinb"><span class="str"></span>${body}<span class="clipx"></span></div></div><div class="pburst"></div>`;
            g7.appendChild(w);
            p.pin = w.querySelector('.pin'); p.pb = w.querySelector('.pinb'); p.bu = w.querySelector('.pburst');
            const tIn = T.c7 + 0.06 + (p.x / 1920) * 0.4;
            tl.fromTo(p.w, { opacity: 0 }, { opacity: 1, duration: 0.01 }, L(tIn));
            tl.fromTo(p.pb, { opacity: 0, scale: 0.2, y: -20 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: 'back.out(2)' }, L(tIn));
            // pop off, on his word
            tl.to(p.pb, { y: -26, scale: 1.18, duration: 0.09, ease: 'power2.out' }, L(p.pop));
            tl.to(p.pb, { x: p.fx * 340, y: -520, rotation: p.fx * 240, scale: 0.55, opacity: 0, duration: 0.55, ease: 'power2.in' }, L(p.pop + 0.09));
            tl.fromTo(p.bu, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 2.1, duration: 0.5, ease: 'power3.out', immediateRender: false }, L(p.pop));
            tl.set(p.w, { opacity: 0 }, L(p.pop + 0.7));
          });
          F.revealWords(tl, $('s2-f7a-1'), 'v09', S, { from: 0, to: 1, y: 24, blur: 14, dur: 0.5 }); gap($('s2-f7a-1'));
          F.revealWords(tl, $('s2-f7a-2'), 'v09', S, { from: 2, to: 3, y: 24, blur: 14, dur: 0.5 }); gap($('s2-f7a-2'));
          F.revealWords(tl, $('s2-f7b-1'), 'v09', S, { from: 4, to: 7, y: 18, blur: 10 }); gap($('s2-f7b-1'));
          // the slam
          [['s2-nv1', 36.708, 1.75], ['s2-nv2', 37.108, 1.95]].forEach(([id, t0, sc]) => {
            tl.fromTo('#' + id, { opacity: 0, scale: sc, filter: 'blur(18px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.22, ease: 'power4.out' }, L(t0 - 0.02));
            tl.fromTo('#s2-slashflash', { opacity: 0.22 }, { opacity: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, L(t0));
          });
          tl.fromTo('#s2-f7b-3', { opacity: 0, y: 26, filter: 'blur(10px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.5, ease: 'power3.out' }, L(F.wordAt('v09', 'sold') - 0.04));
          tl.to('#s2-f7b', { opacity: 0, duration: 0.4, ease: 'power2.in' }, L(38.85));
          tl.fromTo('#s2-f7b', { opacity: 1 }, { opacity: 1, duration: 0.01 }, L(T.c7b));

          // ------------------------------------------------ per-frame driver: camera, parallax, rope-riding props
          const wl = $('s2-world'), coin = $('s2-coin'), f7b = $('s2-f7b');
          function update(t) {
            const cam = F.camera(t);
            wl.style.transform = F.cameraCSS(t);
            if (t >= T.c5 && t < T.c6) {
              let steps = 0; SS.VERBS.forEach(v => { if (t >= v) steps++; });
              layers.forEach(Ly => {
                const sc = 1 + (cam.zoom - 1) * Ly.par * 1.4;
                const y = -((t - T.c5) * Ly.speed + steps * Ly.step * Ly.lh);
                Ly.el.style.transform = `translate(${(-(cam.x - 960) * Ly.par).toFixed(2)}px, ${y.toFixed(2)}px) scale(${sc.toFixed(4)})`;
              });
            }
            if (t >= T.c6b && t < T.c7) {
              const path = SS.f6bPath(t), u = F.E.inOutCubic(F.prog(SS.COIN.go, SS.COIN.arrive, t));
              const p = F.pointAt(path, u * path.L), hop = 22 * Math.sin(Math.PI * u);
              coin.style.transform = `translate(${p.x.toFixed(2)}px, ${(p.y - 34 - hop).toFixed(2)}px) rotate(${(u * 560).toFixed(1)}deg)`;
            }
            if (t >= T.c7) {
              PINS.forEach((p, i) => {
                const y = SS.f7y(p.x, t), ang = Math.atan(SS.f7slope(p.x, t)) * 180 / Math.PI;
                p.w.style.transform = `translate(${p.x}px, ${y.toFixed(2)}px)`;
                p.pin.style.transform = `rotate(${(3.2 * Math.sin(t * 2.1 + i * 1.7) - ang * 0.35).toFixed(2)}deg)`;
              });
            }
            if (t >= T.c7b) {
              const sx = (cam.x - 960) * 2.2, sy = (cam.y - 540) * 2.2;
              f7b.style.transform = `translate(${sx.toFixed(2)}px, ${sy.toFixed(2)}px)`;
            }
          }
          const P = { t: S };
          tl.fromTo(P, { t: S }, { t: TO, duration: TO - S, ease: 'none', onUpdate: () => update(P.t) }, 0);
          update(S);
          window.__timelines['s2-different'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
