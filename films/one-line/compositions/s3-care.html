          tl.fromTo('#s3-care-ta .focus', { opacity: 0 }, { opacity: 1, duration: .25 }, L(T.type0 - .45));
          tl.set('#s3-care-caret', { opacity: 1 }, L(T.type0 - .4));
          tl.fromTo(p, { n: 0 }, { n: ANSWER.length, duration: T.type1 - T.type0, ease: 'none', onUpdate: () => { typed.textContent = ANSWER.slice(0, Math.round(p.n)); } }, L(T.type0));
          tl.set('#s3-care-caret', { opacity: 0 }, L(T.submit - .05));
          tl.to('#s3-care-submit', { scale: .965, duration: .1, yoyo: true, repeat: 1, ease: 'power2.inOut' }, L(T.submit - .08));
          tl.fromTo('#s3-care-submit .done', { opacity: 0 }, { opacity: 1, duration: .25 }, L(T.submit + .08));

          // ---- the cursor: calm, human; no AI
          const cur = '#s3-care-cursor', cp = { x: 560, y: 330 };
          const fromTo = (x0, y0, x1, y1, at, dur) => tl.fromTo(cur, { x: x0, y: y0 }, { x: x1, y: y1, duration: dur, ease: 'power2.inOut' }, L(at));
          const chip = [-410 + 44 + 70, 42], box = [-410 + 66, 68], ta = [-120, 60], sub = [-410 + 440 + 168, -235 + 376 + 29];
          tl.fromTo(cur, { opacity: 0 }, { opacity: 1, duration: .5 }, L(49.35));
          fromTo(560, 330, chip[0], chip[1], 49.4, 1.7);
          fromTo(chip[0], chip[1], box[0], box[1], T.card2 + .35, 1.0);       // follows question 2 up to the front
          fromTo(box[0], box[1], ta[0], ta[1], T.card3 + .25, .9);
          fromTo(ta[0], ta[1], sub[0], sub[1], T.type1 + .05, .7);
          tl.to(cur, { opacity: 0, duration: .4 }, L(T.submit + .9));
          const click = at => {
            tl.fromTo('#s3-care-cursor svg', { scale: 1 }, { scale: .86, duration: .07, yoyo: true, repeat: 1, transformOrigin: '3px 2px', ease: 'power2.out' }, L(at - .07));
            tl.fromTo('#s3-care-ripple', { opacity: .7, scale: .3 }, { opacity: 0, scale: 1.5, duration: .55, ease: 'power2.out' }, L(at));
          };
          [T.pick1, T.pick2, T.type0 - .45, T.submit].forEach(click);

          // ---- the whip: everything is carried off left with the camera, smeared, and gone
          tl.to('#s3-care-content', { filter: 'blur(26px)', duration: .2, ease: 'power2.in' }, L(T.whip0 + .02));
          tl.to('#s3-care-content', { opacity: 0, duration: .12, ease: 'none' }, L(T.whip0 + .12));
          tl.set('#s3-care-content', { visibility: 'hidden' }, L(T.whipMid));

          window.__timelines['s3-care'] = tl;
        })();
      </script>
    </template>
  </body>
