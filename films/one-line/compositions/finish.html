<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
        #finish-vig, #finish-grain, #finish-fade { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        /* plum-tinted radial vignette; element opacity = edge strength (corners reach it) */
        #finish-vig { background: radial-gradient(ellipse farthest-corner at 50% 50%,
          rgba(30,6,50,0) 38%, rgba(30,6,50,0.22) 62%, rgba(30,6,50,0.62) 84%, rgba(30,6,50,1) 100%); opacity: 0.13; }
        #finish-fade { background: rgb(8,4,14); opacity: 1; }
      </style>
      <div data-hf-id="hf-txts" id="root" data-composition-id="finish" data-width="1920" data-height="1080" data-duration="95">
        <div data-hf-id="hf-hxcp" id="finish-vig"></div>
        <canvas data-hf-id="hf-b7gx" id="finish-grain"></canvas>
        <div data-hf-id="hf-ly7n" id="finish-fade"></div>
      </div>
      <script>
        /* FINISH — global grade layer for "One Line" (whole film, transparent).
         *  - vignette: radial, rgba(30,6,50) — edge alpha ≈ .13 light sections, ≈ .34 dark, eased between
         *  - grain: seeded noise tiles; tile + offset picked from the frame index round(t*60) → seek-deterministic.
         *    Drawn as signed alpha noise (white lifts, black pulls) because a sub-composition cannot blend against
         *    the layers below it. Strength per section.
         *  - head: 1.1 s fade in from rgb(8,4,14). tail: fade to it over the last 1.5 s (95.0 total).
         */
        (function () {
          const F = window.FILM, DUR = 95, TS = F.T.sections;
          const clamp = F.clamp, lerp = F.lerp;
          const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };

          // ---- darkness profile 0 (light) .. 1 (dark): platforms 13.09–19.2, breakdown→build 39.27–65.45
          const DARK = [[0, 0], [TS.platforms - 0.3, 0], [TS.platforms + 0.9, 1], [19.0, 1], [19.4, 0.15], [TS.drop, 0.0],
            [TS.breakdown - 0.5, 0], [TS.breakdown + 1.6, 1], [64.6, 1], [TS.climax + 0.9, 0], [DUR, 0]];
          function darkness(t) {
            for (let i = 1; i < DARK.length; i++) if (t <= DARK[i][0]) {
              const a = DARK[i - 1], b = DARK[i];
              return b[0] === a[0] ? b[1] : lerp(a[1], b[1], smooth(a[0], b[0], t));
            }
            return 0;
          }

          // ---- vignette + grain strengths
          const vig = document.getElementById('finish-vig');
          const fade = document.getElementById('finish-fade');
          const cv = document.getElementById('finish-grain'), ctx = cv.getContext('2d');
          const dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
          cv.width = Math.round(1920 * dpr); cv.height = Math.round(1080 * dpr);

          // ---- pre-baked grain tiles (seeded; no Math.random). Slightly soft so it survives H.264.
          const NT = 8, TILE = 512, tiles = [];
          function gauss(r) { return (r() + r() + r() + r() - 2) * 1.55; }      // ≈ N(0,1)-ish
          for (let k = 0; k < NT; k++) {
            const r = F.rng(9001 + k * 131), raw = new Float32Array(TILE * TILE);
            for (let i = 0; i < raw.length; i++) raw[i] = gauss(r);
            const c = document.createElement('canvas'); c.width = c.height = TILE;
            const cx = c.getContext('2d'), img = cx.createImageData(TILE, TILE);
            for (let y = 0; y < TILE; y++) for (let x = 0; x < TILE; x++) {
              // 3x3 blur (wrapped) → ~1.3 px grain, then re-normalise
              let a = 0;
              for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) a += raw[((y + dy + TILE) % TILE) * TILE + ((x + dx + TILE) % TILE)] * (dx === 0 && dy === 0 ? 2 : 1);
              const n = clamp(a / 10.5 * 2.1, -1, 1), j = (y * TILE + x) * 4;
              const v = n >= 0 ? 255 : 0;
              img.data[j] = img.data[j + 1] = img.data[j + 2] = v; img.data[j + 3] = Math.round(Math.abs(n) * 255);
            }
            cx.putImageData(img, 0, 0); tiles.push(c);
          }
          const hash = (n) => { let h = (n * 2654435761) >>> 0; h ^= h >>> 15; h = Math.imul(h, 2246822519) >>> 0; h ^= h >>> 13; return (h >>> 0) / 4294967296; };
          const GRAIN_LIGHT = 0.016, GRAIN_DARK = 0.024;     // element-level alpha scale of the ±noise (0.05/0.085 read as noisy)
          function paint(t) {
            const d = darkness(t);
            vig.style.opacity = String(lerp(0.13, 0.34, d));
            const frame = Math.round(t * 60);
            const tile = tiles[frame % NT];
            const ox = Math.floor(hash(frame * 2 + 1) * TILE), oy = Math.floor(hash(frame * 2 + 2) * TILE);
            const s = dpr * 1.25;              // grain blob ≈ 1.25 css px (× dpr in device px)
            ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
            ctx.globalAlpha = lerp(GRAIN_LIGHT, GRAIN_DARK, d);
            ctx.imageSmoothingEnabled = true;
            const step = TILE * s;
            for (let y = -oy * s; y < cv.height; y += step) for (let x = -ox * s; x < cv.width; x += step) {
              ctx.setTransform(s, 0, 0, s, x, y); ctx.drawImage(tile, 0, 0);
            }
            ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
          }

          const tl = gsap.timeline({ paused: true });
          const p = { t: 0 };
          tl.fromTo(p, { t: 0 }, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => paint(p.t) }, 0);
          // head + tail fades (plain GSAP, seek-safe)
          tl.fromTo(fade, { opacity: 1 }, { opacity: 0, duration: 1.1, ease: 'power2.out' }, 0);
          tl.fromTo(fade, { opacity: 0 }, { opacity: 1, duration: 1.5, ease: 'power2.in', immediateRender: false }, DUR - 1.5);
          paint(0);
          window.__timelines['finish'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
